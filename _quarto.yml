project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "!templates/"
  resources:
    - robots.txt

lang: en

website:
  title: "Sungjun Park"
  site-url: "https://sjpark-math41.github.io"
  description: "Academic website of Sungjun Park, a graduate student in mathematics at Yonsei University."
  favicon: assets/images/favicon.svg
  image: assets/images/social/og-default.png
  image-alt: "Sungjun Park — Mathematics, Probability, and Stochastic Processes"
  open-graph:
    locale: en_US
    site-name: "Sungjun Park"
  twitter-card: true
  back-to-top-navigation: true
  bread-crumbs: true
  page-navigation: true
  search:
    location: navbar
    type: overlay
    limit: 15
    copy-button: true
  navbar:
    pinned: true
    collapse-below: lg
    left:
      - href: index.qmd
        text: Home
      - href: about.qmd
        text: About
      - href: research/index.qmd
        text: Research
      - href: notes/index.qmd
        text: Notes
      - href: teaching/index.qmd
        text: Teaching
      - href: seminars/index.qmd
        text: Seminars
      - href: cv/index.qmd
        text: CV
    right:
      - icon: envelope
        href: mailto:sungjun.park@yonsei.ac.kr
        aria-label: Email
      - icon: github
        href: https://github.com/sjpark-math41
        aria-label: GitHub
  page-footer:
    left: "© 2026 Sungjun Park · 박성준"
    right: "Department of Mathematics, Yonsei University"

format:
  html:
    theme:
      light: [cosmo, styles/light.scss]
      dark: [darkly, styles/dark.scss]
    css: styles/notes-structure.css
    toc: true
    toc-depth: 3
    smooth-scroll: true
    code-copy: true
    code-overflow: wrap
    link-external-icon: true
    link-external-newwindow: true
    html-math-method: mathjax
    date-format: "YYYY-MM-DD"
    anchor-sections: true

execute:
  freeze: auto
